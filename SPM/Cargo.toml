[package]
name = "spm-proxy"
version = "0.1.0"
edition = "2021"
description = "Lightweight reverse proxy that masks email addresses in prompts before forwarding to an upstream AI service"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
