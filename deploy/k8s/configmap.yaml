apiVersion: v1
kind: ConfigMap
metadata:
  name: aispm-config
data:
  APP_ENV: production
  CORS_ORIGINS: '["https://app.aispm.io"]'
  DEFAULT_FREE_MAX_AGENTS: "10"
  DEFAULT_FREE_MAX_PROMPTS_PER_DAY: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: aispm-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://aispm:CHANGE_ME@postgres:5432/aispm
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: CHANGE_ME_USE_VAULT
  PLATFORM_JWT_SECRET_KEY: CHANGE_ME_USE_VAULT
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
