name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aispm
          POSTGRES_PASSWORD: aispm
          POSTGRES_DB: aispm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run cross-tenant security suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aispm:aispm@localhost:5432/aispm_test
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET_KEY: ci-test-secret
          PLATFORM_JWT_SECRET_KEY: ci-platform-secret
        run: pytest tests/ -v --tb=short

      - name: Lint backend
        working-directory: backend
        run: ruff check src tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test agent workspace
        working-directory: agent
        run: cargo test --workspace
