name: Agent CI

# Windows (Win32 APIs via the optional windows-service feature on
# agent-service) and Linux (systemd) are both supported - see
# agent/crates/agent-service and agent/crates/agent-core/src/network_setup.rs
# for the platform-specific transparent-interception bits.
#
# This workspace's TLS stack (boring/tokio-boring/hyper-boring, i.e.
# BoringSSL via boring-sys) needs libclang (bindgen) plus Go/CMake/NASM to
# build from source - not all preinstalled on every runner image, so this
# installs them explicitly rather than assuming they're there.
#
# Scoped to the agent/ subtree (paths filter) since this lives in the same
# repo as the rest of the proxy platform and shouldn't run on unrelated
# changes.
on:
  push:
    branches: ["proxy"]
    paths: ["agent/**"]
  pull_request:
    branches: ["proxy"]
    paths: ["agent/**"]
  # Lets this be run on demand from the Actions tab - useful right after
  # adding/changing the workflow itself, since a path-filtered push/PR won't
  # fire it unless the push actually touches agent/**.
  workflow_dispatch:

defaults:
  run:
    working-directory: agent

jobs:
  test:
    name: Build & test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install NASM
        # boring-sys (BoringSSL) uses NASM-based assembly on x86_64, same
        # reason rust-ci.yml needs it for aws-lc-rs - not preinstalled on
        # the windows-latest runner image.
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Install LLVM/libclang
        # bindgen (via boring-sys) needs libclang to generate BoringSSL's
        # FFI bindings. Not guaranteed present on windows-latest; installed
        # explicitly rather than hoping it's already on PATH.
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - name: Install build tools for BoringSSL (clang, cmake, go)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libclang-dev cmake golang-go

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Build workspace
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --verbose

  # Goes beyond `test` above: builds the real agent-service binary and runs
  # it against the real AI-SPM backend stack (deploy/docker-compose.yml) -
  # actual registration (org token + mTLS cert issuance), a live heartbeat,
  # a PII-bearing prompt through the agent's own local_api, and confirming
  # the masked (never raw) event lands in the backend's audit log. This is
  # the same flow validated by hand before; running it on every agent/**
  # change means a change that breaks the agent<->backend contract (e.g. a
  # response shape drift, a masking regression, a duplicate-fleet-entry
  # bug on reinstall) fails CI instead of surfacing after release. See
  # agent/scripts/e2e-smoke-test.py for what's actually asserted.
  #
  # Only needs ubuntu-latest - this validates the agent<->backend contract,
  # which isn't platform-specific (the `test` job above already covers
  # Windows build/unit-test separately).
  e2e-against-backend:
    name: E2E smoke test against live backend
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools for BoringSSL (clang, cmake, go)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang libclang-dev cmake golang-go

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Build agent-service
        working-directory: agent
        run: cargo build -p agent-service --verbose

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Bring up the AI-SPM backend (postgres, redis, api, kong)
        # Deliberately excludes dashboard/prometheus/grafana/minio - not
        # needed for this contract test and only adds build/startup time.
        # --wait blocks until each service's healthcheck passes (api,
        # postgres, redis have one); the smoke test itself also polls
        # /health before doing anything, as a second line of defense since
        # Kong has no healthcheck block in this compose file.
        run: >
          docker compose -f deploy/docker-compose.yml up -d --build
          --wait --wait-timeout 180 postgres redis api kong

      - name: Run end-to-end smoke test against the real backend
        run: |
          python3 agent/scripts/e2e-smoke-test.py \
            --agent-service agent/target/debug/agent-service \
            --gateway-url http://localhost:8090

      - name: Backend logs (on failure, for debugging)
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs api kong

      - name: Tear down the backend stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
