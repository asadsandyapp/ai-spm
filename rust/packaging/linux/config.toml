[proxy]
listen_addr = "127.0.0.1"
listen_port = 8443
max_body_bytes = 10_485_760
on_oversized = "log"

[ca]
cert_path = "/var/lib/ai-spm-dlp-agent/ca/root.crt"
key_path = "/var/lib/ai-spm-dlp-agent/ca/root.key"

[targets]
domains = [
    "chat.openai.com",
    "chatgpt.com",
    "api.openai.com",
    "claude.ai",
    "api.anthropic.com",
    "gemini.google.com",
    "generativelanguage.googleapis.com",
    "bard.google.com",
]

[policy]
source = "/etc/ai-spm-dlp-agent/policies/default.toml"

[logging]
level = "info"
file_dir = "/var/log/ai-spm-dlp-agent"

[sysnet]
pac_path = "/var/lib/ai-spm-dlp-agent/proxy.pac"
pac_port = 8444

# Cloud fleet registration - optional. Leave commented out for a fully
# standalone agent (the default). Set both fields to register this agent
# with the AI-SPM control-plane using the company install token an admin
# distributes (see README.md's "Cloud registration" section). state_dir is
# overridden here (default is "data/cloud", relative to this file's own
# directory - i.e. under /etc) to keep mutable runtime state under /var/lib
# with the rest of this package's state, matching ca.cert_path/key_path above.
# [cloud]
# gateway_url = "https://gateway.example.com"
# install_token = "<org_id>.<secret>"
# state_dir = "/var/lib/ai-spm-dlp-agent/cloud"
