[proxy]
listen_addr = "127.0.0.1"
listen_port = 8443
max_body_bytes = 10_485_760
on_oversized = "log"

[ca]
cert_path = "data/ca/root.crt"
key_path = "data/ca/root.key"

[targets]
domains = [
    "chat.openai.com",
    "chatgpt.com",
    "api.openai.com",
    "claude.ai",
    "api.anthropic.com",
    "gemini.google.com",
    "generativelanguage.googleapis.com",
    "bard.google.com",
    # Loopback alias used for local end-to-end testing against a mock server.
    "dlp-test.local",
]

[policy]
source = "policies/default.toml"

[logging]
level = "info"
file_dir = "logs"

# Cloud fleet registration - optional. Leave commented out for a fully
# standalone agent (the default). Set both fields to register this agent
# with the AI-SPM control-plane using the company install token an admin
# distributes (see README.md's "Cloud registration" section).
# [cloud]
# gateway_url = "https://gateway.example.com"
# install_token = "<org_id>.<secret>"
